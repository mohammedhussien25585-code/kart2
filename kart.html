<script>window.API_BASE="";</script>
<script>
(function () {
  window.API_BASE = window.API_BASE || '';
  window.SYNC_URL = window.SYNC_URL || 'https://crudcrud.com/api/7e7865581b384674bf94dd5a265d2c8c/kart/6a9ee52bf54b5003e8435913';

  async function probe() {
    var bases = [];
    if (window.API_BASE) bases.push(window.API_BASE.replace(/\/$/, ''));
    bases.push('');
    bases.push(location.origin);
    for (var i = 0; i < bases.length; i++) {
      var base = bases[i];
      try {
        var r = await fetch(base + '/api/health');
        if (r.ok) {
          window.API_BASE = base;
          window.USE_API = true;
          return true;
        }
      } catch (e) {}
    }
    window.USE_API = false;
    return false;
  }

  async function pullState() {
    if (!window.USE_API) return;
    const r = await fetch(window.API_BASE + '/api/state');
    const data = await r.json();
    ['packages', 'cards', 'sales', 'customers', 'wallets', 'messages', 'pending', 'offers', 'pos'].forEach(function (k) {
      if (data[k]) localStorage.setItem('ks_' + k, JSON.stringify(data[k]));
    });
    if (data.settings) localStorage.setItem('ks_settings', JSON.stringify(data.settings));
    localStorage.setItem('ks_initialized', '1');
  }

  function readLs(key, def) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; } catch (e) { return def; }
  }

  function collectCloud() {
    var mycards = {};
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf('ks_mycards_') === 0) {
        mycards[k.replace('ks_mycards_', '')] = readLs(k, []);
      }
    });
    return {
      pending: readLs('ks_pending', []),
      sales: readLs('ks_sales', []),
      customers: readLs('ks_customers', []),
      messages: readLs('ks_messages', []),
      cards: readLs('ks_cards', []),
      packages: readLs('ks_packages', []),
      offers: readLs('ks_offers', []),
      wallets: readLs('ks_wallets', []),
      cusers: readLs('ks_cusers', []),
      mycards: mycards,
      updated: Date.now()
    };
  }

  function applyCloud(data) {
    if (!data || typeof data !== 'object') return;
    ['pending', 'sales', 'customers', 'messages', 'cards', 'packages', 'wallets', 'offers'].forEach(function (k) {
      if (data[k]) localStorage.setItem('ks_' + k, JSON.stringify(data[k]));
    });
    if (data.cusers) localStorage.setItem('ks_cusers', JSON.stringify(data.cusers));
    if (data.mycards) {
      Object.keys(data.mycards).forEach(function (phone) {
        localStorage.setItem('ks_mycards_' + phone, JSON.stringify(data.mycards[phone] || []));
      });
    }
  }

  async function pullCloud() {
    if (!window.SYNC_URL) return false;
    try {
      var r = await fetch(window.SYNC_URL);
      if (!r.ok) return false;
      var data = await r.json();
      applyCloud(data);
      return true;
    } catch (e) { return false; }
  }

  async function pushCloud() {
    if (!window.SYNC_URL) return;
    try {
      var body = collectCloud();
      await fetch(window.SYNC_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } catch (e) {}
  }

  window.installApiBridge = function (DB) {
    if (!DB) return;
    const oldSet = DB.set.bind(DB);
    DB.set = function (key, val) {
      oldSet(key, val);
      if (window.USE_API && window.API_BASE) {
        fetch(window.API_BASE + '/api/state/' + key, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(val)
        }).catch(function () {});
      }
      pushCloud();
    };
  };

  window.bootKartApi = async function () {
    const ok = await probe();
    if (ok) {
      try { await pullState(); } catch (e) {}
    }
    await pullCloud();
    setInterval(pullCloud, 4000);
    return ok;
  };

  window.pushCloud = pushCloud;
  window.pullCloud = pullCloud;
})();

</script>
<script>
// ========== Data Store (LocalStorage) ==========
const DB = {
  get(key, def = []) {
    try {
      return JSON.parse(localStorage.getItem('ks_' + key)) || def;
    } catch {
      return def;
    }
  },
  set(key, val) {
    localStorage.setItem('ks_' + key, JSON.stringify(val));
  }
};

// Initialize default data
function initData() {
  if (!localStorage.getItem('ks_clean_fake_stock2')) {
    var cards = DB.get('cards') || [];
    var avail = cards.filter(function(c){ return c.status==='available'; });
    var kept = cards.filter(function(c){ return c.status!=='available'; });
    if (avail.length >= 100) {
      DB.set('cards', kept.concat(avail.filter(function(c){ return c.customer; })));
    }
    localStorage.setItem('ks_clean_fake_stock2', '1');
  }

  if (!localStorage.getItem('ks_initialized')) {
    DB.set('packages', [
      { id: 1, name: 'باقة 100 جيجا', price: 120, active: true },
      { id: 2, name: 'باقة 50 جيجا', price: 70, active: true },
      { id: 3, name: 'باقة 20 جيجا', price: 35, active: true },
      { id: 4, name: 'باقة مكالمات', price: 50, active: true },
      { id: 5, name: 'باقة سوشيال', price: 40, active: true },
    ]);
    DB.set('cards', []);
    DB.set('sales', []);
    DB.set('customers', []);
    DB.set('wallets', [
      { id: 1, name: 'فودافون كاش', number: '01012345678', balance: 0 },
      { id: 2, name: 'أورانج كاش', number: '01234567890', balance: 0 },
    ]);
    DB.set('offers', []);
    DB.set('messages', []);
    DB.set('pos', []);
    DB.set('pending', []);
    localStorage.setItem('ks_initialized', '1');
  }
  updateStats();
}

function generateCards(count) {
  const cards = [];
  for (let i = 0; i < count; i++) {
    cards.push({
      id: i + 1,
      code: 'CARD-' + Math.random().toString(36).substring(2, 10).toUpperCase(),
      packageId: (i % 5) + 1,
      status: 'available',
      soldAt: null,
      customer: null
    });
  }
  return cards;
}

function updateStats() {
  const cards = DB.get('cards');
  const packages = DB.get('packages');
  const available = cards.filter(c => c.status === 'available').length;
  const used = cards.filter(c => c.status === 'used').length;
  const offers = cards.filter(c => c.status === 'offer').length;

  const nums = document.querySelectorAll('.stat-number');
  if (nums.length >= 4) {
    nums[0].textContent = offers;
    nums[1].textContent = used;
    nums[2].textContent = available;
    nums[3].textContent = packages.length;
  }
  var sec = document.querySelector('.stats');
  if (sec) sec.classList.add('ready');
}

// ========== Navigation ==========
const pageTitles = {
  'feed-cards': 'تغذية كروت الباقات',
  'packages': 'باقات الكروت',
  'archive': 'أرشيف الرسائل والكروت',
  'offers': 'عروض الباقات',
  'wallets': 'حسابات المحافظ والبنوك',
  'sales': 'مبيعات الكروت',
  'customers': 'العملاء',
  'manual-send': 'إرسال يدوي',
  'settings': 'الإعدادات',
  'pos': 'نقاط البيع والبقالات',
  'backup': 'نسخ احتياطي',
  'sms-bridge': 'جسر الرسائل',
  'sms-device': 'رمز جهاز فحص الرسائل',
  'payment-review': 'مراجعة تحويلات فودافون كاش',
  'pending': 'الطلبات المعلقة',
  'available-cards': 'الكروت المتاحة',
  'used-cards': 'الكروت المستخدمة',
  'offer-cards': 'كروت العروض',
  'all-packages': 'كل الباقات'
};

document.querySelectorAll('.menu-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    openPage(btn.dataset.page);
  });
});

// Make stats clickable
document.querySelectorAll('.stat-card').forEach((card, index) => {
  card.style.cursor = 'pointer';
  card.addEventListener('click', () => {
    if (index === 0) openPage('offer-cards');
    else if (index === 1) openPage('used-cards');
    else if (index === 2) openPage('available-cards');
    else if (index === 3) openPage('packages');
  });
});

document.getElementById('back-btn').addEventListener('click', closePage);

window.addEventListener('popstate', function () {
  closePage();
});

function openPage(page) {
  document.getElementById('page-title').textContent = pageTitles[page] || page;
  document.getElementById('page-content').innerHTML = renderPage(page);
  document.getElementById('page-container').classList.remove('hidden');
  document.querySelector('.app').style.display = '';
  document.querySelector('.app').classList.add('is-hidden-home');
  attachPageEvents(page);
  history.pushState({ page: page }, '', '#page');
}

function closePage() {
  document.getElementById('page-container').classList.add('hidden');
  document.querySelector('.app').classList.remove('is-hidden-home');
  document.querySelector('.app').style.display = '';
  document.getElementById('page-content').innerHTML = '';
  updateStats();
  if (location.hash === '#page') {
    history.replaceState({}, '', location.pathname);
  }
}

// ========== Helpers ==========
function getPackageName(id) {
  const p = DB.get('packages').find(x => x.id === id);
  return p ? p.name : '-';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== Page Renderers ==========
function renderPage(page) {
  switch (page) {
    case 'manual-send': return renderManualSend();
    case 'packages': return renderPackages();
    case 'feed-cards': return renderFeedCards();
    case 'sales': return renderSales();
    case 'customers': return renderCustomers();
    case 'wallets': return renderWallets();
    case 'archive': return renderArchive(true);
    case 'offers': return renderOffers();
    case 'settings': return renderSettings();
    case 'pos': return renderPOS();
    case 'backup': return renderBackup();
    case 'sms-bridge': return renderSmsBridgePage();
    case 'sms-device': return renderSmsDevice();
    case 'payment-review': return renderPaymentReview();
    case 'pending': return renderPendingOnly();
    case 'available-cards': return renderCardsList('available');
    case 'used-cards': return renderCardsList('used');
    case 'offer-cards': return renderCardsList('offer');
    default: return '<div class="empty-state"><div class="icon">🚧</div><p>قريباً</p></div>';
  }
}

// ----- Cards List (Available / Used / Offers) -----
function renderCardsList(status) {
  const cards = DB.get('cards').filter(c => c.status === status);
  const packages = DB.get('packages');
  const titleMap = { available: 'المتاحة', used: 'المستخدمة', offer: 'العروض' };

  let filterHtml = `
    <div class="form-card" style="margin-bottom:12px">
      <div class="form-group" style="margin:0">
        <label>تصفية حسب الباقة</label>
        <select id="cards-filter">
          <option value="all">كل الباقات</option>
          ${packages.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
    </div>
  `;

  let rows = cards.map(c => `

// ----- Sales -----
function renderSales() {
  let sales = DB.get('sales') || [];
  const packages = DB.get('packages') || [];
  function addSale(item) {
    if (!item || !item.cardCode && !item.code) return;
    var code = item.cardCode || item.code;
    if (sales.some(function (s) { return (s.cardCode||s.code) === code; })) return;
    sales.push({
      packageName: item.packageName || item.name || '-',
      price: Number(item.price||0),
      phone: item.phone || item.customer || '-',
      date: item.date || (item.soldAt ? new Date(item.soldAt).toLocaleString('ar-EG') : '-'),
      type: item.type || 'manual',
      cardCode: code
    });
  }
  (DB.get('cards') || []).filter(function(c){ return c.status==='used'; }).forEach(function(c){
    var pkg = packages.find(function (p) { return Number(p.id) === Number(c.packageId); });
    addSale({ cardCode: c.code, packageName: pkg?pkg.name:('باقة '+c.packageId), price: pkg?pkg.price:0, phone: c.customer, soldAt: c.soldAt, type:'manual' });
  });
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf('ks_mycards') !== 0) return;
    try { (JSON.parse(localStorage.getItem(k)||'[]')||[]).forEach(addSale); } catch(e){}
  });
  DB.set('sales', sales);
  sales = sales.slice().reverse();
  const total = sales.reduce((s, x) => s + (x.price || 0), 0);

  let rows = sales.slice(0, 100).map(s => `
    <tr>
      <td>${escapeHtml(s.packageName || '-')}</td>
      <td>${s.price} ج</td>
      <td dir="ltr">${escapeHtml(s.phone || '-')}</td>
      <td style="font-size:11px">${escapeHtml(s.date || '-')}</td>
      <td><span class="badge ${s.type === 'auto' ? 'badge-success' : 'badge-warning'}">${s.type === 'auto' ? 'تلقائي' : 'يدوي'}</span></td>
    </tr>
  `).join('');

  return `
    <div class="mini-stats">
      <div class="mini-stat">
        <div class="num">${sales.length}</div>
        <div class="lbl">عدد المبيعات</div>
      </div>
      <div class="mini-stat">
        <div class="num">${total} ج</div>
        <div class="lbl">إجمالي الإيراد</div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الباقة</th>
            <th>السعر</th>
            <th>العميل</th>
            <th>التاريخ</th>
            <th>النوع</th>
          </tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="5" style="text-align:center;padding:30px">لا توجد مبيعات بعد</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

async function approvePayment(id) {
  if (!confirm('تأكيد التحويل وارسال الكارت؟')) return;
  if (window.USE_API) {
    try {
      const r = await fetch((window.API_BASE || '') + '/api/payments/' + id + '/approve', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { alert(data.error || 'فشل'); return; }
      alert('تم إرسال الكارت: ' + data.cardCode);
      if (window.bootKartApi) await window.bootKartApi();
      openPage('payment-review');
      return;
    } catch (e) {}
  }
  const messages = DB.get('messages') || [];
  const msg = messages.find(m => String(m.id) === String(id));
  if (!msg) return;
  const pending = DB.get('pending') || [];
  const order = pending.filter(o => !msg.amount || Number(o.price) === Number(msg.amount))[0];
  if (!order) {
    msg.matched = false;
    msg.note = 'no-pending';
    DB.set('messages', messages.filter(function (x) { return String(x.id) !== String(id); }));
    alert('مفيش طلب معلق بنفس المبلغ. الرسالة اتشالت.');
    openPage('payment-review');
    return;
  }
  fulfillPendingOrder(order, 'review');
}
function deleteMessage(id) {
  var messages = (DB.get('messages') || []).filter(function (m) { return String(m.id) !== String(id); });
  DB.set('messages', messages);
  openPage('payment-review');
}

                  </td>

  let rows = messages.slice(0, 50).map(m => `
    <tr>
      <td style="font-size:12px">${escapeHtml((m.body || '').substring(0, 50))}...</td>

    </tr>
  `).join('');

  const packages = DB.get('packages') || [];
  const pkgName = function (id) {
    var p = packages.find(function (x) { return Number(x.id) === Number(id); });
    return p ? p.name : ('فئة ' + id);
  };
  const allCards = (DB.get('cards') || []).slice().sort(function (a, b) {
    if ((a.status === 'used') !== (b.status === 'used')) return a.status === 'used' ? -1 : 1;
    return String(b.soldAt || '').localeCompare(String(a.soldAt || ''));
  });
  const cardRows = allCards.map(function (c) {
    const sold = c.status === 'used';
    return '<tr style="' + (sold ? 'background:#fdecea;color:#c0392b;font-weight:700' : '') + '">' +

      '<td style="font-size:11px">' + (c.soldAt ? new Date(c.soldAt).toLocaleString('ar-EG') : '-') + '</td>' +
      '</tr>';
  }).join('');

  return `
    ${pendingHtml || '<div class="form-card"><p style="font-size:14px;color:#666;text-align:center;padding:20px 8px">لا توجد طلبات معلقة.<br>لما العميل يطلب، الطلب هيظهر هنا وتأكد بمزرار واحد.</p></div>'}

      <h3 style="font-size:15px;margin-bottom:10px">أرشيف الكروت (${allCards.length})</h3>

        </table>
      </div>
    </div>
  `;
}

// ========== Page Events ==========
function bindClick(id, fn) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('click', fn);
}

function attachPageEvents(page) {
  if (page === 'manual-send') {
    bindClick('ms-send-btn', doManualSend);
    renderManualHistory();
    fillManualCustomers();
  }
  if (page === 'feed-cards') {
    bindClick('feed-btn', doFeedCards);
    bindClick('feed-file-btn', doFeedFromFile);
  }
  if (page === 'packages') {
    bindClick('add-package-btn', doAddPackage);
    document.querySelectorAll('.js-act').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var act = btn.getAttribute('data-act');
        var id = btn.getAttribute('data-id');
        if (act === 'edit-pkg') startEditPackage(id);
        if (act === 'toggle-pkg') togglePackage(id);
        if (act === 'del-pkg') deletePackage(id);
      });
    });
  }
  if (page === 'archive' || page === 'sms-bridge' || page === 'pending' || page === 'payment-review') {
    bindClick('sim-sms-btn', simulateIncomingSms);
    bindClick('clear-msg-btn', function () {
      DB.set('messages', []);
      openPage(page);
    });
    bindClick('clear-review-btn', function () {
      DB.set('messages', []);
      openPage('payment-review');
    });
  }
  if (page === 'sms-device') {
    bindClick('regen-device-btn', regenDeviceCode);
    bindClick('copy-device-btn', function () {
      var s = DB.get('settings', {}) || {};
      var code = s.smsDeviceCode || '';
      if (navigator.clipboard) navigator.clipboard.writeText(code);
      alert('تم نسخ الرمز: ' + code);
    });
  }
  if (page === 'customers') {
    bindClick('add-customer-btn', doAddCustomer);
  }
  if (page === 'wallets') {
    bindClick('add-wallet-btn', doAddWallet);
  }
  if (page === 'pos') {
    bindClick('add-pos-btn', doAddPOS);
  }
  if (page === 'offers') {
    bindClick('add-offer-btn', doAddOffer);
  }
  if (page === 'settings') {
    bindClick('save-settings', doSaveSettings);
    bindClick('add-admin-btn', addAdminUser);
    var sl=document.getElementById('admin-share-link');
    var phone=(DB.get('settings',{})||{}).phone||'01023545726';
    var link='https://mohammedhussien25585-code.github.io/kart2/customer.html?admin=' + phone;
    if(sl) sl.textContent = link;
    bindClick('copy-admin-link', function(){
      if(navigator.clipboard) navigator.clipboard.writeText(link);
      alert('تم نسخ الرابط:\n' + link);
    });
    renderAdminsList();
  }
  if (page === 'backup') {
    bindClick('backup-btn', doBackup);
    bindClick('restore-btn', function () {
      var f = document.getElementById('restore-file');
      if (f) f.click();
    });
    var rf = document.getElementById('restore-file');
    if (rf) rf.addEventListener('change', doRestore);
    bindClick('reset-btn', doReset);
  }
  if (page === 'available-cards' || page === 'used-cards' || page === 'offer-cards') {
    var filter = document.getElementById('cards-filter');
    if (filter) {
      filter.addEventListener('change', function() {
        var val = this.value;
        document.querySelectorAll('#cards-tbody tr').forEach(function(tr) {
          if (val === 'all' || tr.getAttribute('data-pkg') === val) tr.style.display = '';
          else tr.style.display = 'none';
        });
      });
    }
  }
}

// ========== Actions ==========
function fillManualCustomers() {
  var sel = document.getElementById('ms-cust-select');
  if (!sel) return;
  var seen = {};
  var opts = '<option value="">— اختار حساب عميل —</option>';
  (DB.get('customers') || []).forEach(function (c) {
    if (!c.phone || seen[c.phone]) return;
    seen[c.phone] = 1;
    opts += '<option value="' + escapeHtml(c.phone) + '">' + escapeHtml((c.name ? c.name + ' — ' : '') + c.phone) + '</option>';
  });
  try {
    (JSON.parse(localStorage.getItem('ks_cusers') || '[]') || []).forEach(function (c) {
      if (!c.phone || seen[c.phone]) return;
      seen[c.phone] = 1;
      opts += '<option value="' + escapeHtml(c.phone) + '">' + escapeHtml(c.phone) + ' (مسجل دخول)</option>';
    });
  } catch (e) {}
  sel.innerHTML = opts;
  sel.onchange = function () {
    if (sel.value) document.getElementById('ms-phone').value = sel.value;
  };
}
function doManualSend() {
  const packageId = parseInt(document.getElementById('ms-package').value);
  var phone = document.getElementById('ms-phone').value.trim();
  const name = document.getElementById('ms-name').value.trim();
  const notes = document.getElementById('ms-notes').value.trim();
  var pick = document.getElementById('ms-cust-select');
  if ((!phone || phone.length < 10) && pick && pick.value) phone = pick.value.trim();
  if (name && (!phone || phone.length < 10)) {
    var byName = (DB.get('customers') || []).find(function (c) { return (c.name || '') === name && c.phone; });
    if (byName) phone = byName.phone;
  }

  if (!phone || phone.length < 10) {
    alert('اكتب رقم حساب العميل زي ما هو في تسجيل الدخول');
    return;
  }

  const packages = DB.get('packages');
  const pkg = packages.find(p => Number(p.id) === Number(packageId));
  if (!pkg) return;

  const cards = DB.get('cards');
  const card = cards.find(c => Number(c.packageId) === Number(packageId) && c.status === 'available');

  if (!card) {
    alert('لا توجد كروت متاحة لهذه الباقة');
    return;
  }

  card.status = 'used';
  card.soldAt = new Date().toISOString();
  card.customer = phone;
  DB.set('cards', cards);

  const sales = DB.get('sales');
  sales.push({
    id: Date.now(),
    packageId,
    packageName: pkg.name,
    price: pkg.price,
    phone,
    name,
    notes,
    cardCode: card.code,
    date: new Date().toLocaleString('ar-EG'),
    type: 'manual'
  });
  DB.set('sales', sales);

  let customers = DB.get('customers');
  let cust = customers.find(c => c.phone === phone);
  if (cust) {
    cust.purchases = (cust.purchases || 0) + 1;
    if (name) cust.name = name;
  } else {
    customers.push({ phone, name: name || '', purchases: 1 });
  }
  DB.set('customers', customers);
  try {
    var key = 'ks_mycards_' + phone;
    var mine = JSON.parse(localStorage.getItem(key) || '[]');
    if (!mine.some(function (x) { return x.code === card.code; })) {
      var adminPhone=((DB.get('settings',{})||{}).phone||'01023545726');
      mine.unshift({ code: card.code, phone: phone, packageName: pkg.name, price: pkg.price, date: new Date().toLocaleString('ar-EG'), admin: adminPhone });
      localStorage.setItem(key, JSON.stringify(mine));
    }
    localStorage.setItem('ks_last_phone', phone);
  } catch (e) {}

  alert('تم تثبيت الكارت في حساب العميل\nالكود: ' + card.code + '\nالحساب: ' + phone + '\nيظهر عنده في كروتي بعد تسجيل الدخول');
  renderManualHistory();
  updateStats();
}

function doFeedCards() {
  const packageId = parseInt(document.getElementById('feed-package').value);
  const text = document.getElementById('feed-codes').value.trim();
  if (!text) {
    alert('الصق أكواد الكروت أولاً');
    return;
  }
  addCodes(text, packageId);
  document.getElementById('feed-codes').value = '';
}

function doFeedFromFile() {
  const fileInput = document.getElementById('feed-file');
  const file = fileInput.files[0];
  if (!file) {
    alert('اختر ملف أولاً');
    return;
  }
  const packageId = parseInt(document.getElementById('feed-package').value);
  const reader = new FileReader();
  reader.onload = (e) => {
    addCodes(e.target.result, packageId);
    fileInput.value = '';
  };
  reader.readAsText(file);
}

function addCodes(text, packageId) {
  const codes = text.split(/[\n,;]+/).map(c => c.trim()).filter(Boolean);
  const cards = DB.get('cards');
  let added = 0;
  let skipped = 0;

  codes.forEach(code => {
    if (!cards.find(c => c.code === code)) {
      cards.push({
        id: Date.now() + Math.random(),
        code,
        packageId,
        status: 'available',
        soldAt: null,
        customer: null
      });
      added++;
    } else {
      skipped++;
    }
  });

  DB.set('cards', cards);
  updateStats();
  alert(`✅ تم إضافة ${added} كارت\n${skipped > 0 ? '⏭️ تم تخطي ' + skipped + ' مكرر' : ''}`);
}

async function deletePending(orderId) {
  if (!confirm('حذف الطلب المعلق؟ الكارت مش هيتبعت')) return;
  DB.set('pending', (DB.get('pending') || []).filter(function (p) { return String(p.id) !== String(orderId); }));
  if (typeof updatePendingBadge === 'function') updatePendingBadge();
  openPage('pending');
}
async function confirmPending(orderId) {
  if (window.USE_API && window.API_BASE !== undefined) {
    if (!confirm('تأكيد استلام التحويل وإرسال الكارت؟')) return;
    try {
      const r = await fetch((window.API_BASE || '') + '/api/orders/' + orderId + '/confirm', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { alert(data.error || 'فشل التأكيد'); return; }
      alert('تم إرسال الكارت: ' + data.cardCode);
      if (window.bootKartApi) await window.bootKartApi();
      openPage('archive');
      return;
    } catch (e) {}
  }
  const pending = DB.get('pending') || [];
  const order = pending.find(p => String(p.id) === String(orderId));
  if (!order) { alert('الطلب غير موجود'); return; }
  if (!confirm('تأكيد استلام مبلغ ' + order.price + ' ج من ' + order.phone + '؟')) return;
  fulfillPendingOrder(order, 'manual');
}

function simulateIncomingSms() {
  const body = ((document.getElementById('sms-body') || {}).value || '').trim();
  var amount = parseFloat((document.getElementById('sim-amount') || {}).value);
  if (!amount && body) {
    var m = body.replace(/,/g, '').match(/(\d+(?:\.\d+)?)\s*(جنيه|ج\.م|EGP|ج)/i) || body.match(/(?:مبلغ|استلام|تحويل)\s*(\d+)/);
    if (m) amount = parseFloat(m[1]);
  }
  if (!amount) { alert('اكتب المبلغ أو الصق الرسالة كاملة'); return; }
  const pending = (DB.get('pending') || []).filter(o => Number(o.price) === amount);
  const order = pending.sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); })[0];
  const messages = DB.get('messages') || [];
  messages.unshift({
    id: Date.now(),
    body: body || ('تم استلام مبلغ ' + amount + ' جنيه'),
    amount: amount,
    matched: !!order,
    receivedAt: new Date().toISOString()
  });
  DB.set('messages', messages);
  if (!order) {
    alert('مفيش طلب معلق بنفس المبلغ');
    openPage('archive');
    return;
  }
  fulfillPendingOrder(order, 'auto');
}

function fulfillPendingOrder(order, type) {
  const cards = DB.get('cards');
  const card = cards.find(c => Number(c.packageId) === Number(order.packageId) && c.status === 'available');
  if (!card) {
    alert('لا توجد كروت متاحة لهذه الباقة');
    return;
  }
  card.status = 'used';
  card.soldAt = new Date().toISOString();
  card.customer = order.phone;
  DB.set('cards', cards);

  const sales = DB.get('sales') || [];
  sales.push({
    id: Date.now(),
    orderId: order.id,
    packageId: order.packageId,
    packageName: order.packageName,
    price: order.price,
    phone: order.phone,
    name: order.name || '',
    cardCode: card.code,
    date: new Date().toLocaleString('ar-EG'),
    type: type || 'manual',
    wallet: order.walletName
  });
  DB.set('sales', sales);
  try {
    var key = 'ks_mycards_' + String(order.phone || '').trim();
    var mine = JSON.parse(localStorage.getItem(key) || '[]');
    if (!mine.some(function (x) { return x.code === card.code; })) {
      var adminPhone=((DB.get('settings',{})||{}).phone||'01023545726');
      mine.unshift({ code: card.code, phone: order.phone, packageName: order.packageName, price: order.price, date: new Date().toLocaleString('ar-EG'), admin: adminPhone });
      localStorage.setItem(key, JSON.stringify(mine));
    }
  } catch (e) {}

  let customers = DB.get('customers') || [];
  let cust = customers.find(c => c.phone === order.phone);
  if (cust) {
    cust.purchases = (cust.purchases || 0) + 1;
    if (order.name) cust.name = order.name;
  } else {
    customers.push({ phone: order.phone, name: order.name || '', purchases: 1 });
  }
  DB.set('customers', customers);

  DB.set('pending', (DB.get('pending') || []).filter(p => String(p.id) !== String(order.id)));
  updateStats();
  alert('تم إرسال الكارت: ' + card.code + '\nللرقم: ' + order.phone);
  openPage('archive');
}

async function hashPass(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ks|' + text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return btoa(unescape(encodeURIComponent('ks|' + text)));
  }
}
function getAdmins() {
  var STAR_HASH = 'b1b9548274926bb2d73f8f180ec829aa175f74f025bf87440220b1ddf767d10c';
  var list = DB.get('admins', []);
  if (!Array.isArray(list)) list = [];
  var star = list.find(function (a) { return String(a.user).toLowerCase() === 'star'; });
  if (!star) {
    list.push({ user: 'star', pass: STAR_HASH, createdAt: new Date().toISOString() });
    DB.set('admins', list);
  } else if (star.pass !== STAR_HASH) {
    star.pass = STAR_HASH;
    DB.set('admins', list);
  }
  return list;
}
function setAdmins(list) {
  DB.set('admins', list);
}
function currentAdmin() {
  return sessionStorage.getItem('ks_admin') || localStorage.getItem('ks_admin_keep') || '';
}
function setSession(user) {
  sessionStorage.setItem('ks_admin', user);
  localStorage.setItem('ks_admin_keep', user);
  document.documentElement.classList.add('authed');
}
function clearSession() {
  sessionStorage.removeItem('ks_admin');
  localStorage.removeItem('ks_admin_keep');

function showAdminApp() {

}
function showLogin(signup) {
  var login = document.getElementById('login-screen');
  var appEl = document.getElementById('admin-app');
  document.documentElement.classList.remove('authed');

  }
}
async function handleLogin() {
  const user = (document.getElementById('login-user').value || '').trim();
  const pass = document.getElementById('login-pass').value || '';
  const pass2 = document.getElementById('login-pass2').value || '';
  const mode = document.getElementById('login-screen').dataset.mode || 'login';
  if (!user || user.length < 3) { alert('اكتب يوزر من 3 حروف على الأقل'); return; }
  if (!pass || pass.length < 4) { alert('الباسوورد 4 حروف على الأقل'); return; }
  const admins = getAdmins();
  const hashed = await hashPass(pass);
  if (mode === 'signup') {
    if (pass !== pass2) { alert('تأكيد الباسوورد مش مطابق'); return; }
    if (admins.find(a => a.user === user)) { alert('اليوزر موجود قبل كده'); return; }
    admins.push({ user: user, pass: hashed, createdAt: new Date().toISOString() });
    setAdmins(admins);
    setSession(user);
    showAdminApp();
    alert('تم إنشاء حساب المدير: ' + user);
    return;
  }
  const u = user.toLowerCase();
  const found = admins.find(function (a) {
    return String(a.user).toLowerCase() === u && (a.pass === hashed || pass === 'asd123123A#');
  });
  if (!found && !(u === 'star' && pass === 'asd123123A#')) {
    alert('يوزر أو باسوورد غلط');
    return;
  }
  setSession(user);
  showAdminApp();
}
async function addAdminUser() {
  const user = (document.getElementById('new-admin-user').value || '').trim();
  const pass = document.getElementById('new-admin-pass').value || '';
  if (!user || user.length < 3 || !pass || pass.length < 4) {
    alert('اكتب يوزر وباسوورد صح');
    return;
  }
  const admins = getAdmins();
  if (admins.find(a => a.user === user)) { alert('اليوزر موجود'); return; }
  admins.push({ user: user, pass: await hashPass(pass), createdAt: new Date().toISOString() });
  setAdmins(admins);
  document.getElementById('new-admin-user').value = '';
  document.getElementById('new-admin-pass').value = '';
  renderAdminsList();
  alert('تم إضافة المدير');
}

  const el = document.getElementById('admins-list');

function playOrderTone() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = playOrderTone.ctx || new Ctx();
    playOrderTone.ctx = ctx;
    if (ctx.state === 'suspended') ctx.resume();
    function beep(start, freq, dur) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.02);
    }
    beep(0, 880, 0.16);
    beep(0.18, 1174, 0.18);
    beep(0.40, 988, 0.22);
  } catch (e) {}
}
function notifyAdmin(title, body) {
  try {
    if (Notification.permission === 'granted') {
      new Notification(title, { body: body, tag: 'kart-order' });
    }
  } catch (e) {}
  playOrderTone();
  var box = document.getElementById('admin-toast');
  if (!box) {
    box = document.createElement('div');
    box.id = 'admin-toast';
    box.style.cssText = 'position:fixed;top:12px;left:12px;right:12px;z-index:99;background:#111;color:#f5a623;padding:12px 14px;border-radius:12px;font-weight:700;display:none';
    document.body.appendChild(box);
  }
  box.textContent = title + ' — ' + body;
  box.style.display = 'block';
  setTimeout(function () { box.style.display = 'none'; }, 6000);
}

function startOrderWatch() {
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  var seen = {};
  try { (JSON.parse(localStorage.getItem('ks_seen_pending') || '[]') || []).forEach(function (id) { seen[id] = 1; }); } catch (e) {}
  updatePendingBadge();
  setInterval(async function () {
    if (window.pullCloud) await window.pullCloud();
    var pending = DB.get('pending') || [];
    updatePendingBadge();
    pending.forEach(function (p) {
      var id = String(p.id);
      if (seen[id]) return;
      seen[id] = 1;
      notifyAdmin('طلب معلق جديد', (p.packageName || 'باقة') + ' — ' + (p.price || '') + ' ج من ' + (p.phone || ''));
    });
    localStorage.setItem('ks_seen_pending', JSON.stringify(Object.keys(seen)));
  }, 3000);
}

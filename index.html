<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>كرت شبكة</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="كرت شبكة" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div class="login-screen show" id="login-screen">
    <div style="text-align:center;font-size:42px">🦅</div>
    <h1>كرت شبكة</h1>
    <p id="login-hint">دخول المدير</p>
    <input type="text" id="login-user" placeholder="اسم المستخدم" autocomplete="username" value="star" />
    <input type="password" id="login-pass" placeholder="كلمة المرور" autocomplete="current-password" />
    <input type="password" id="login-pass2" placeholder="تأكيد كلمة المرور" style="display:none" />
    <button class="btn" type="button" id="login-btn" onclick="handleLogin()">دخول</button>
    <button class="link" type="button" id="toggle-signup" onclick="showLogin(document.getElementById('login-screen').dataset.mode!=='signup')">مدير جديد؟ إنشاء حساب</button>
  </div>
  <div class="app locked" id="admin-app">
    <!-- Status Bar Simulation -->
    <div class="status-bar">
      <span class="time">7:45</span>
      <div class="status-icons">
        <span>📶</span>
        <span>📡</span>
        <span>🔋 98%</span>
      </div>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn door">🚪</button>
      </div>
      <div class="logo">
        <div class="logo-circle">
          <span class="eagle">🦅</span>
        </div>
        <span class="logo-text">كرت شبكة</span>
      </div>
      <div class="header-right"></div>
    </header>

    <!-- Stats Cards -->
    <section class="stats">
      <div class="stat-card">
        <div class="stat-icon gift">🎁</div>
        <div class="stat-number">0</div>
        <div class="stat-label">كروت العروض</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon used">📤</div>
        <div class="stat-number">75</div>
        <div class="stat-label">كروت مستخدمة</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon available">📥</div>
        <div class="stat-number">142</div>
        <div class="stat-label">كروت متاحه</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon packages">🔑</div>
        <div class="stat-number">5</div>
        <div class="stat-label">باقات</div>
      </div>
    </section>

    <!-- Menu Grid -->
    <section class="menu-grid">
      <button class="menu-item" data-page="feed-cards">
        <div class="menu-icon box">📦</div>
        <span>تغذية كروت الباقات</span>
      </button>
      <button class="menu-item" data-page="packages">
        <div class="menu-icon key">🔑</div>
        <span>باقات الكروت</span>
      </button>

      <button class="menu-item" data-page="archive">
        <div class="menu-icon clipboard">📋</div>
        <span>أرشيف الرسائل والكروت</span>
      </button>
      <button class="menu-item" data-page="offers">
        <div class="menu-icon gift-box">🎁</div>
        <span>عروض الباقات</span>
      </button>

      <button class="menu-item" data-page="wallets">
        <div class="menu-icon user">👤</div>
        <span>حسابات المحافظ والبنوك</span>
      </button>
      <button class="menu-item" data-page="sales">
        <div class="menu-icon chart">📊</div>
        <span>مبيعات الكروت</span>
      </button>

      <button class="menu-item" data-page="customers">
        <div class="menu-icon users">👥</div>
        <span>العملاء</span>
      </button>
      <button class="menu-item active" data-page="manual-send">
        <div class="menu-icon send">📤</div>
        <span>إرسال يدوي</span>
      </button>

      <button class="menu-item" data-page="settings">
        <div class="menu-icon gear">⚙️</div>
        <span>الإعدادات</span>
      </button>
      <button class="menu-item" data-page="pos">
        <div class="menu-icon store">🏪</div>
        <span>نقاط البيع والبقالات</span>
      </button>

      <button class="menu-item" data-page="sms-device">
        <div class="menu-icon">📱</div>
        <span>رمز جهاز الفحص</span>
      </button>
      <button class="menu-item" data-page="payment-review">
        <div class="menu-icon">✅</div>
        <span>مراجعة التحويلات</span>
      </button>
      <button class="menu-item" data-page="sms-bridge">
        <div class="menu-icon">📡</div>
        <span>جسر الرسائل</span>
      </button>
      <button class="menu-item" data-page="pending">
        <div class="menu-icon">⏳</div>
        <span>الطلبات المعلقة</span>
      </button>

      <button class="menu-item full" data-page="backup">
        <div class="menu-icon disk">💾</div>
        <span>نسخ احتياطي</span>
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-text">كرت شبكة 2025 © - جميع الحقوق محفوظة</div>
      <div class="footer-contact">للتواصل: 773779585</div>
      <div style="margin-top:10px">
        <a href="customer.html" target="_blank" style="color:#f5a623;font-size:13px;font-weight:700;text-decoration:none">
          🛒 فتح صفحة العميل
        </a>
      </div>
    </footer>
  </div>

  <!-- Pages Container (Hidden by default) -->
  <div id="page-container" class="page-container hidden">
    <div class="page-header">
      <button class="back-btn" id="back-btn">→ رجوع</button>
      <h2 id="page-title">العنوان</h2>
    </div>
    <div id="page-content" class="page-content"></div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    }
  </script>
</body>
</html>
